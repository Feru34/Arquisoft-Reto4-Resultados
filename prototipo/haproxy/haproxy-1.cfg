global
  maxconn 60000
  log stdout format raw local0 warning

defaults
  mode http
  log global
  option dontlognull
  timeout connect 1s
  timeout client 30s
  timeout server 10s
  timeout http-keep-alive 60s
  retries 2
  option redispatch
  maxconn 60000

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s
  hold nx 1s

frontend obu
  bind :8080
  default_backend receptores

# Balanceador: reparte solo entre los receptores que laten (health check cada 1 s).
backend receptores
  balance roundrobin
  option httpchk GET /health
  http-reuse always
  default-server inter 1s fall 2 rise 1 init-addr last,libc,none resolvers docker
  server r1 receptor-1:8080 check

listen stats
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s
